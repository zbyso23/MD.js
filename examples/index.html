};
const source = document.getElementById('source');
let currentDocumentName='Untitled.md';
const status = document.getElementById('status');
const preview = document.getElementById('preview');
const md = new MD({ mode:'extended' });
function redraw() {
  try {
    md.mount(preview, source.value);
    if (window.MDMathPlugin) window.MDMathPlugin.render(preview);
    const drawn = preview.querySelectorAll('figure.md-diagram').length;
    const fallback = preview.querySelectorAll('pre.md-diagram-fallback').length;
    status.textContent = `${drawn} diagramů · ${fallback} fallback`; status.style.color = '#a9efdb';
  } catch (e) { status.textContent = `Error: ${e.message}`; status.style.color = '#ffabac'; }
}
let queued = false;
source.addEventListener('input', () => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; redraw(); });
});
const use = key => { source.value = samples[key]; redraw(); };
document.getElementById('reset').addEventListener('click', () => use('overview'));
document.querySelectorAll('[data-example]').forEach(b => b.addEventListener('click', () => use(b.dataset.example)));
use('overview');
const $=id=>document.getElementById(id);
$('nav-back').onclick=()=>history.back();$('nav-forward').onclick=()=>history.forward();
$('file-open').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){alert('Maximum Markdown file size is 4 MB');return;}source.value=await f.text();currentDocumentName=f.name;$('doc-name').textContent=f.name;redraw();e.target.value='';};
function stamp(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0'),String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0'),String(d.getSeconds()).padStart(2,'0')].join('');}
$('file-save').onclick=()=>{const original=(currentDocumentName||'Untitled.md').replace(/\.(md|markdown|txt)$/i,'').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,75)||'Untitled';const name=original+'_'+stamp()+'.md';const url=URL.createObjectURL(new Blob([source.value],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
function setMode(mode){document.body.classList.toggle('reader-view',mode==='reader');document.body.classList.toggle('projector-view',mode==='projector');$('mode-editor').setAttribute('aria-pressed',String(mode==='editor'));$('mode-reader').setAttribute('aria-pressed',String(mode==='reader'));$('mode-projector').setAttribute('aria-pressed',String(mode==='projector'));redraw();}
$('mode-editor').onclick=()=>setMode('editor');$('mode-reader').onclick=()=>setMode('reader');$('mode-projector').onclick=()=>setMode('projector');$('mode-print').onclick=()=>{redraw();window.print();};setMode('editor');

</script>
