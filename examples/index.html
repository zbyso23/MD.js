  :root { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #d9e8fb; background: #0b1422; }

  .pane-head { display: flex; justify-content: space-between; align-items: center; background: #1a3049; padding: 12px 17px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }

  .preview-wrap { background: #e6ebf3; padding: 14px; max-height: calc(100vh - 149px); overflow: auto; }
  #preview { padding: 17px 24px 32px; border-radius: 10px; box-shadow: 0 5px 20px #06142618; }
  .preset-bar { display: flex; gap: .5em; flex-wrap: wrap; padding: 11px 14px; border-top: 1px solid #304660; }
  .preset { font-size: 12px; }
  #status { font-size: 12px; color: #93a7c4; font-weight: 500; }
  @media (max-width: 930px) { main { grid-template-columns: 1fr; } #source { height: 330px; min-height: 330px; } .preview-wrap { max-height: initial; } }
</style>
</head>
<body>
<header class="mast"><div><h1>MD.js <span>Reborn</span> <small>↗</small></h1><p>ARCTIC EDITION · PHASE 2 + 3 · Vanilla ES6</p></div><span class="tag">ZERO IMPORTS · SVG-FIRST · LIGHT / DARK</span></header>
<main>
  <section class="pane" aria-label="Editor Markdown">
    <div class="pane-head"><span>01 — Markdown editor</span><button id="reset" type="button">Obnovit ukázku</button></div>
    <textarea id="source" spellcheck="false" aria-label="Zdroj Markdown"></textarea>
    <nav class="preset-bar" aria-label="Ukázky"><button type="button" class="preset" data-example="overview">Všechno</button><button type="button" class="preset" data-example="flow">Flowchart</button><button type="button" class="preset" data-example="sequence">Sequence</button><button type="button" class="preset" data-example="pie">Pie chart</button><button type="button" class="preset" data-example="class">Class</button><button type="button" class="preset" data-example="timeline">Timeline</button><button type="button" class="preset" data-example="security">Útočný text</button></nav>
  </section>
  <section class="pane" aria-label="Náhled Markdown"><div class="pane-head"><span>02 — Reader / Live preview</span><span id="status" role="status" aria-live="polite">Ready</span></div><div class="preview-wrap"><article id="preview" class="md-root" data-md-theme="light"></article></div></section>
</main>
<script src="../MD.js"></script><script src="../MD-diagrams.js"></script><script src="../MD-UX.js"></script>
<script>
'use strict';
const samples = {
  overview: String.raw`# MD.js Reborn 🧊

> V pravém panelu najdeš přepínání dark/light, velikosti textu a navigaci dokumentem.

  flow: String.raw`# Mermaid-like Flowchart

~~~mermaid

};
const source = document.getElementById('source');
const status = document.getElementById('status');
const preview = document.getElementById('preview');
const md = new MD({ mode:'extended' });
function redraw() {
  try {
    md.mount(preview, source.value);
    const drawn = preview.querySelectorAll('figure.md-diagram').length;
    const fallback = preview.querySelectorAll('pre.md-diagram-fallback').length;
    status.textContent = `${drawn} diagramů · ${fallback} fallback`; status.style.color = '#a9efdb';
  } catch (e) { status.textContent = `Error: ${e.message}`; status.style.color = '#ffabac'; }
}
let queued = false;
source.addEventListener('input', () => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; redraw(); });
});
const use = key => { source.value = samples[key]; redraw(); };
document.getElementById('reset').addEventListener('click', () => use('overview'));
document.querySelectorAll('[data-example]').forEach(b => b.addEventListener('click', () => use(b.dataset.example)));
use('overview');
</script>
</body>
</html>
