<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MD.js Ultra · Micro R Statistics Lab</title><style>body{font:15px system-ui;background:#111b2d;color:#e9efff;max-width:1000px;margin:20px auto;padding:16px}textarea{width:100%;box-sizing:border-box;min-height:220px;background:#07101c;color:#bde9d6;border:1px solid #53627a;border-radius:8px;padding:14px;font:15px monospace}button,select{padding:9px;margin:7px 5px 7px 0;background:#273d59;color:white;border:1px solid #8298b1;border-radius:6px}pre{white-space:pre-wrap}#output,#chart{background:#f3f7ff;color:#132033;padding:14px;min-height:110px;overflow:auto;border-radius:8px}svg{max-width:100%;height:auto}</style></head><body><h1>Micro R · Statistics Lab</h1><label for="lang">Language / Jazyk</label> <select id="lang"><option value="en">English</option><option value="cs">Čeština</option></select><p id="intro">Offline R-like numeric subset, not full R. Each line is one expression or assignment.</p><textarea id="code" spellcheck="false">x <- c(3,5,7,9,11)
y <- c(2,4,8,8,13)
summary(x)
lm(y,x)
hist(x)
plot(x,y)</textarea><div><label for="preset">Example / Ukázka</label> <select id="preset" aria-label="Micro R examples"><option value="summary">Summary / Souhrn</option><option value="regression">Regression / Regrese</option><option value="distribution">Distribution / Rozdělení</option><option value="vectors">Vectors / Vektory</option></select></div><div><button id="run">Run / Spustit</button><button id="reset">Reset demo</button></div><h2 id="results-title">Results</h2><pre id="output" role="status"></pre><div id="chart"></div><script src="micro-r.js"></script><script>
const $=id=>document.getElementById(id),demo=$('code').value;
const presets={summary:`x <- c(3,5,7,9,11)
summary(x)
mean(x)
median(x)
sd(x)
hist(x)`,regression:`x <- c(1,2,3,4,5,6)
y <- c(2,3,5,4,7,8)
lm(y,x)
plot(x,y)`,distribution:`x <- c(11,12,12,15,17,18,19,21,24,27)
quantile(x,0.25)
quantile(x,0.75)
summary(x)
hist(x)`,vectors:`x <- seq(0,10,1)
y <- x^2 + 2*x + 1
mean(y)
plot(x,y)`};
function chart(data){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 280');svg.setAttribute('role','img');svg.setAttribute('aria-label',data.chart+' chart');const rect=(x,y,w,h,fill)=>{const e=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:h,fill}).forEach(([k,v])=>e.setAttribute(k,v));svg.appendChild(e)};rect(0,0,640,280,'#f3f7ff');let x=data.x,y=data.y;if(data.chart==='hist'){const min=Math.min(...x),max=Math.max(...x),n=Math.min(12,Math.max(3,Math.ceil(Math.sqrt(x.length)))),b=Array(n).fill(0);x.forEach(v=>b[Math.min(n-1,Math.floor((v-min)/((max-min)||1)*n))]++);const peak=Math.max(...b);b.forEach((v,i)=>rect(48+i*540/n,245-v/peak*195,540/n-3,v/peak*195,'#426ab1'));}else{let minX=Math.min(...x),maxX=Math.max(...x),minY=Math.min(...y),maxY=Math.max(...y);x.forEach((v,i)=>{const px=48+(v-minX)/((maxX-minX)||1)*540,py=245-(y[i]-minY)/((maxY-minY)||1)*195;rect(px-4,py-4,8,8,'#426ab1')});}return svg;}
function execute(){try{let result=MDMicroR.run($('code').value);$('output').textContent=result.outputs.map(o=>'> '+o.source+'\n'+JSON.stringify(o.value,null,2)).join('\n\n');$('chart').replaceChildren(...result.outputs.filter(o=>o.value&&o.value.chart).map(o=>chart(o.value)));}catch(e){$('output').textContent='ERROR: '+e.message;$('chart').replaceChildren();}}
$('preset').onchange=()=>{$('code').value=presets[$('preset').value];execute()};$('run').onclick=execute;$('reset').onclick=()=>{$('code').value=demo;execute()};$('lang').onchange=()=>{$('intro').textContent=$('lang').value==='cs'?'Offline numerický jazyk podobný R, nejde o úplné R. Každý řádek obsahuje jeden výraz nebo přiřazení.':'Offline R-like numeric subset, not full R. Each line is one expression or assignment.';$('results-title').textContent=$('lang').value==='cs'?'Výsledky':'Results';};execute();
</script></body></html>
